# Builds the iPhone version of Doable (the Swift app in ios/) on every push to the swift-ios branch and
# publishes it as a GitHub PRE-release, tag ios-v1.0.N, with:
#   - Doable-iOS-Xcode.zip  → open in Xcode, sign with your own Apple developer account, run (see IOS.md)
#   - Doable-unsigned.ipa   → for signing tools such as Sideloadly
#   - ios-screenshot.png    → Doable running in the iPhone Simulator, as a quick check
#
# ⚠️ Pre-releases are never "latest", so Toby's Android link
#    releases/latest/download/Doable.apk  keeps pointing at the Android app.
name: Build iPhone app

on:
  push:
    branches: ['swift-ios']
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write # needed to create releases

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: 1.0.${{ github.run_number }}
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Use the newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Copy web app into the iPhone project
        run: npx cap sync ios

      - name: Stamp the version (1.0.N, build N)
        run: |
          sed -i '' \
            -e "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = $APP_VERSION;/" \
            -e "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/" \
            ios/App/App.xcodeproj/project.pbxproj
          grep -m2 -E "MARKETING_VERSION|CURRENT_PROJECT_VERSION" ios/App/App.xcodeproj/project.pbxproj

      - name: Build for iPhone (unsigned, proves the Swift app compiles)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -quiet build

      - name: Package Doable-unsigned.ipa
        run: |
          mkdir -p Payload
          cp -R build/device/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry Doable-unsigned.ipa Payload
          ls -la Doable-unsigned.ipa

      - name: Package the Xcode project (Doable-iOS-Xcode.zip)
        run: |
          OUT=out/Doable-iOS
          mkdir -p "$OUT"
          git archive HEAD | tar -x -C "$OUT"
          # The iPhone copy only needs the iPhone project (the Android one has its own release).
          rm -rf "$OUT/android" "$OUT/.github"
          # Built web app + generated config (not in git), and the version-stamped project.
          cp -R ios/App/App/public "$OUT/ios/App/App/"
          cp ios/App/App/capacitor.config.json ios/App/App/config.xml "$OUT/ios/App/App/"
          cp ios/App/App.xcodeproj/project.pbxproj "$OUT/ios/App/App.xcodeproj/"
          # The Capacitor plugins that ios/App/CapApp-SPM/Package.swift points at, so Xcode alone is enough.
          mkdir -p "$OUT/node_modules/@capacitor"
          for p in app filesystem haptics keyboard local-notifications preferences share splash-screen; do
            rsync -a --exclude android --exclude node_modules "node_modules/@capacitor/$p" "$OUT/node_modules/@capacitor/"
          done
          (cd out && zip -qry ../Doable-iOS-Xcode.zip Doable-iOS)
          ls -la Doable-iOS-Xcode.zip

      - name: Screenshot in the iPhone Simulator
        continue-on-error: true
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO -quiet build
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = json.load(sys.stdin)["devices"]
          for runtime in sorted((k for k in devs if "iOS" in k), reverse=True):
              phones = [d for d in devs[runtime] if d["name"].startswith("iPhone") and "SE" not in d["name"]]
              if phones:
                  print(phones[0]["udid"]); break
          ')
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/sim/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$UDID" com.tickday.app
          sleep 20
          xcrun simctl io "$UDID" screenshot ios-screenshot.png
          ls -la ios-screenshot.png

      - name: Upload build files
        uses: actions/upload-artifact@v7
        with:
          name: Doable-iOS-${{ env.APP_VERSION }}
          path: |
            Doable-iOS-Xcode.zip
            Doable-unsigned.ipa
            ios-screenshot.png
          if-no-files-found: warn

      - name: Publish a pre-release (never "latest")
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ios-v${{ env.APP_VERSION }}
          name: Doable for iPhone ${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: 'false'
          files: |
            Doable-iOS-Xcode.zip
            Doable-unsigned.ipa
            ios-screenshot.png
          body: |
            🍏 **Doable for iPhone**: the same app as on Android, inside a native Swift wrapper.

            **With a Mac + your Apple developer account (recommended):** download **Doable-iOS-Xcode.zip**, unzip it and follow `IOS.md` inside:
            open `ios/App/App.xcodeproj` → Signing & Capabilities → pick your Team → choose your iPhone → ▶ Run.

            **Without a Mac:** sign **Doable-unsigned.ipa** with your Apple ID using a tool such as Sideloadly.

            Version ${{ env.APP_VERSION }} (build ${{ github.run_number }}) from commit ${{ github.sha }}.
            📱 On Android? Use the normal Doable link: https://github.com/${{ github.repository }}/releases/latest/download/Doable.apk

  # The swift-ios copy must keep working on Android (Samsung) too: build the APK as a check (not released).
  android-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Build the Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
