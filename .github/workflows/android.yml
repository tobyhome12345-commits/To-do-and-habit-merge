# Builds a signed Doable APK on every push and publishes it to GitHub Releases.
# (The app was first released as "Tickday"; Doable installs as an update over it.)
# Stable download link (always the newest build):
#   https://github.com/tobyhome12345-commits/To-do-and-habit-merge/releases/latest/download/Doable.apk
#
# ⚠️ Don't rename this file: the build number (github.run_number) is the Android versionCode,
#    and it restarts from 1 if the workflow is renamed, so updates would refuse to install.
name: Build Android APK

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write # needed to create releases

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      APP_VERSION: 1.0.${{ github.run_number }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Copy web app into the Android project
        run: npx cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify the APK signature
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk Doable.apk
          ls -la Doable.apk

      - name: Upload APK as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Doable-${{ env.VERSION_NAME }}
          path: Doable.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Doable ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          make_latest: 'true'
          fail_on_unmatched_files: true
          files: Doable.apk
          body: |
            📲 **Install on your Android phone:** open this link in Chrome, download, then tap the file to install:
            https://github.com/${{ github.repository }}/releases/latest/download/Doable.apk

            Version ${{ env.VERSION_NAME }} (build ${{ github.run_number }}) from commit ${{ github.sha }}.
            Installs over the previous version (including the app when it was called Tickday) and keeps all your habits and tasks.
